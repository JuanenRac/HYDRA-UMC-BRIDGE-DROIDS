[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-bridge-droids"
version = "0.0.4"
description = "Fail-safe HYDRA-UMC to legged/humanoid droid coordination boundary"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "hydra-umc-sdk @ git+https://github.com/JuanenRac/HYDRA-UMC-SDK.git@main#subdirectory=clients/python"
]

[project.optional-dependencies]
# Only open_bosdyn_robot_command() needs this - it's imported lazily (see
# spot_transport.py's own comment) so the rest of the package, including
# every safety-relevant command-building/gating test, works without it
# installed.
spot = ["bosdyn-client>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
